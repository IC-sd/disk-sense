name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm smoke:development
        env:
          DISK_SENSE_SMOKE_VIEW: inspect
          DISK_SENSE_SMOKE_SKIP_SCREENSHOT: '1'
          DISK_SENSE_SMOKE_INSPECT_SEARCH: '1'
          DISK_SENSE_SMOKE_SEARCH_ADVANCED: '1'
          DISK_SENSE_SMOKE_SEARCH_QUERY: search-smoke
          DISK_SENSE_SMOKE_SEARCH_EXPECTED: search-smoke.txt
          DISK_SENSE_SMOKE_FRONTEND_AUDIT: '1'
          DISK_SENSE_SMOKE_FRONTEND_FIXTURES: '1'
      - run: pnpm audit --audit-level=moderate
      - name: Package Windows application
        run: pnpm exec electron-builder --dir
      - run: pnpm check:package
      - name: Smoke test packaged search and IPC
        run: pnpm smoke:desktop
        env:
          DISK_SENSE_SMOKE_VIEW: inspect
          DISK_SENSE_SMOKE_SKIP_SCREENSHOT: '1'
          DISK_SENSE_SMOKE_INSPECT_SEARCH: '1'
          DISK_SENSE_SMOKE_SEARCH_ADVANCED: '1'
          DISK_SENSE_SMOKE_SEARCH_QUERY: search-smoke
          DISK_SENSE_SMOKE_SEARCH_EXPECTED: search-smoke.txt
